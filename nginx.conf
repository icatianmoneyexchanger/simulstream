worker_processes auto;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=off;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # --- Target Egress Stream Destinations ---
            # YouTube Live: Replace YOUR_YOUTUBE_KEY with your key from studio.youtube.com
            # push rtmp://a.rtmp.youtube.com/live2/YOUR_YOUTUBE_KEY;

            # Twitch: Replace YOUR_TWITCH_KEY with your stream key
            # push rtmp://live.twitch.tv/app/YOUR_TWITCH_KEY;

            # Kick / Facebook / Custom Destination
            # push rtmp://fa.rtmp.kick.com/app/YOUR_KICK_KEY;
        }
    }
}
